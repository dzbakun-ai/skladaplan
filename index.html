<!doctype html>
<html lang="ru">

<head>
<meta charset="utf-8">
<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>SKLADAPLAN — WMS</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="app">

  <!-- =====================================================
       SIDEBAR
       ===================================================== -->

  <aside class="sidebar">

    <!-- BRAND -->

    <div class="brand">

      <div class="logo">
        S
      </div>

      <div class="brand-text">

        <b>
          SKLADAPLAN
        </b>

        <span>
          WAREHOUSE MANAGEMENT
        </span>

      </div>

    </div>


    <!-- NAVIGATION -->

    <nav class="sidebar-nav">


      <!-- =================================================
           ОСНОВНАЯ РАБОТА
           ================================================= -->

      <div class="nav-section">

        <div class="nav-section-title">
          ОСНОВНАЯ РАБОТА
        </div>


        <button
          class="nav"
          data-page="dashboard"
        >

          <span class="nav-icon">
            ⌂
          </span>

          <span>
            Главная
          </span>

        </button>


        <button
          class="nav"
          data-page="base"
        >

          <span class="nav-icon">
            ▦
          </span>

          <span>
            База
          </span>

        </button>


        <button
          class="nav"
          data-page="received"
        >

          <span class="nav-icon">
            ↓
          </span>

          <span>
            Приёмка
          </span>

        </button>


        <button
          class="nav"
          data-page="assembly"
        >

          <span class="nav-icon">
            ✓
          </span>

          <span>
            Сборка
          </span>

          <em id="assemblyBadge"></em>

        </button>


        <button
          class="nav"
          data-page="collected"
        >

          <span class="nav-icon">
            ✓
          </span>

          <span>
            Собрано
          </span>

        </button>


        <button
          class="nav"
          data-page="shipped"
        >

          <span class="nav-icon">
            ↑
          </span>

          <span>
            Убыло
          </span>

        </button>

      </div>


      <!-- =================================================
           ИНСТРУМЕНТЫ
           ================================================= -->

      <div class="nav-section">

        <div class="nav-section-title">
          ИНСТРУМЕНТЫ
        </div>


        <button
          class="nav"
          data-page="tools"
          data-tool="compare"
        >

          <span class="nav-icon">
            ⇄
          </span>

          <span>
            Сравнение
          </span>

        </button>


        <button
          class="nav"
          data-page="tools"
          data-tool="split"
        >

          <span class="nav-icon">
            ÷
          </span>

          <span>
            Деление
          </span>

        </button>


        <button
          class="nav"
          data-page="tools"
          data-tool="sum"
        >

          <span class="nav-icon">
            Σ
          </span>

          <span>
            Сумма
          </span>

        </button>


        <button
          class="nav"
          data-page="tools"
          data-tool="inventory"
        >

          <span class="nav-icon">
            ⊙
          </span>

          <span>
            Инвентаризация
          </span>

        </button>


        <button
          class="nav"
          data-page="tools"
          data-tool="excel"
        >

          <span class="nav-icon">
            ↓
          </span>

          <span>
            Excel
          </span>

        </button>


        <button
          class="nav"
          data-page="tools"
          data-tool="data"
        >

          <span class="nav-icon">
            ◫
          </span>

          <span>
            Данные
          </span>

        </button>

      </div>


      <!-- =================================================
           СПРАВОЧНАЯ ИНФОРМАЦИЯ
           ================================================= -->

      <div class="nav-section">

        <div class="nav-section-title">
          СПРАВОЧНАЯ ИНФОРМАЦИЯ
        </div>


        <button
          class="nav"
          data-page="tools"
          data-tool="map-soh"
        >

          <span class="nav-icon">
            ◇
          </span>

          <span>
            Карта СОХ
          </span>

        </button>


        <button
          class="nav"
          data-page="tools"
          data-tool="map-ns"
        >

          <span class="nav-icon">
            ◇
          </span>

          <span>
            Карта НС
          </span>

        </button>


        <button
          class="nav"
          data-page="tools"
          data-tool="help"
        >

          <span class="nav-icon">
            ?
          </span>

          <span>
            Справка
          </span>

        </button>

      </div>

    </nav>


    <!-- SIDEBAR FOOT -->

    <div class="sidebar-foot">

      <div class="offline">

        <i></i>

        Онлайн-режим

      </div>


      <small>

        SKLADAPLAN<br>

        Автор проекта —
        Дмитрий Бакун

      </small>

    </div>

  </aside>


  <!-- =====================================================
       MAIN
       ===================================================== -->

  <main>

    <header class="topbar">


      <!-- MOBILE MENU -->

      <button
        class="mobile-menu"
        id="mobileMenu"
        aria-label="Меню"
      >
        ☰
      </button>


      <!-- PAGE TITLE -->

      <div class="topbar-title">

        <div class="crumb">

          SKLADAPLAN /

          <span id="pageTitle">
            Главная
          </span>

        </div>


        <h1 id="heading">
          Главный экран склада
        </h1>

      </div>


      <!-- TOP ACTIONS -->

      <div class="top-actions">

        <button
          class="ghost"
          id="exportBtn"
        >
          Экспорт JSON
        </button>


        <button
          class="primary"
          id="backupBtn"
        >
          Создать backup
        </button>

      </div>

    </header>


    <!-- PAGE CONTENT -->

    <section id="content"></section>

  </main>

</div>


<!-- =====================================================
     MOBILE NAVIGATION
     ===================================================== -->

<nav
  class="mobile-nav"
  id="mobileNav"
>


  <button
    class="mobile-nav-btn"
    data-page="dashboard"
  >

    <span>
      ⌂
    </span>

    <small>
      Главная
    </small>

  </button>


  <button
    class="mobile-nav-btn"
    data-page="base"
  >

    <span>
      ▦
    </span>

    <small>
      База
    </small>

  </button>


  <button
    class="mobile-nav-btn"
    data-page="received"
  >

    <span>
      ↓
    </span>

    <small>
      Приёмка
    </small>

  </button>


  <button
    class="mobile-nav-btn"
    data-page="assembly"
  >

    <span>
      ✓
    </span>

    <small>
      Сборка
    </small>

    <em id="mobileAssemblyBadge"></em>

  </button>


  <button
    class="mobile-nav-btn"
    data-page="collected"
  >

    <span>
      ✓
    </span>

    <small>
      Собрано
    </small>

  </button>


  <button
    class="mobile-nav-btn"
    data-page="shipped"
  >

    <span>
      ↑
    </span>

    <small>
      Убыло
    </small>

  </button>


  <button
    class="mobile-nav-btn"
    data-page="tools"
  >

    <span>
      ⋯
    </span>

    <small>
      Ещё
    </small>

  </button>

</nav>


<!-- =====================================================
     SUPABASE
     ===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<!-- =====================================================
     XLSX
     ===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>


<!-- =====================================================
     SKLADAPLAN
     ===================================================== -->

<script src="app.js"></script>

</body>

</html>
