<!doctype html>
<html lang="ru">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#ffffff"
  >

  <title>SKLADAPLAN — WMS</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <link
    rel="stylesheet"
    href="help.css"
  >

</head>


<body>

<div class="app">


  <!-- =====================================================
       SIDEBAR
       ===================================================== -->

  <aside class="sidebar">


    <!-- BRAND -->

    <div class="brand">

      <div class="logo">
        S
      </div>

      <div class="brand-text">

        <b>
          SKLADAPLAN
        </b>

        <span>
          WAREHOUSE MANAGEMENT
        </span>

      </div>

    </div>


    <!-- ===================================================
         SIDEBAR NAVIGATION
         =================================================== -->

    <nav class="sidebar-nav">


      <!-- =================================================
           ОСНОВНАЯ РАБОТА
           ================================================= -->

      <div class="nav-section">

        <div class="nav-section-title">
          ОСНОВНАЯ РАБОТА
        </div>


        <!-- ГЛАВНАЯ -->

        <button
          class="nav"
          type="button"
          data-page="dashboard"
        >

          <span class="nav-icon">⌂</span>

          <span>
            Главная
          </span>

        </button>


        <!-- БАЗА -->

        <button
          class="nav"
          type="button"
          data-page="base"
        >

          <span class="nav-icon">▤</span>

          <span>
            База
          </span>

        </button>


        <!-- ПРИЁМКА -->

        <button
          class="nav"
          type="button"
          data-page="received"
        >

          <span class="nav-icon">⇩</span>

          <span>
            Приёмка
          </span>

        </button>


        <!-- СБОРКА -->

        <button
          class="nav"
          type="button"
          data-page="assembly"
        >

          <span class="nav-icon">◫</span>

          <span>
            Сборка
          </span>

          <em
            id="assemblyBadge"
            aria-hidden="true"
          ></em>

        </button>


        <!-- СОБРАНО -->

        <button
          class="nav"
          type="button"
          data-page="collected"
        >

          <span class="nav-icon">✓</span>

          <span>
            Собрано
          </span>

        </button>


        <!-- УБЫЛО -->

        <button
          class="nav"
          type="button"
          data-page="shipped"
        >

          <span class="nav-icon">⇧</span>

          <span>
            Убыло
          </span>

        </button>

      </div>


      <!-- =================================================
           ИНСТРУМЕНТЫ
           ================================================= -->

      <div class="nav-section">

        <div class="nav-section-title">
          ИНСТРУМЕНТЫ
        </div>


        <!-- СРАВНЕНИЕ -->

        <button
          class="nav"
          type="button"
          data-page="tools"
          data-tool="compare"
        >

          <span class="nav-icon">⇄</span>

          <span>
            Сравнение
          </span>

        </button>


        <!-- ДЕЛЕНИЕ -->

        <button
          class="nav"
          type="button"
          data-page="comparison"
          data-tool="split"
        >

          <span class="nav-icon">÷</span>

          <span>
            Деление
          </span>

        </button>


        <!-- СУММА -->

        <button
          class="nav"
          type="button"
          data-page="tools"
          data-tool="sum"
        >

          <span class="nav-icon">Σ</span>

          <span>
            Сумма
          </span>

        </button>


        <!-- ИНВЕНТАРИЗАЦИЯ -->

        <button
          class="nav"
          type="button"
          data-page="tools"
          data-tool="inventory"
        >

          <span class="nav-icon">⊙</span>

          <span>
            Инвентаризация
          </span>

        </button>


        <!-- EXCEL -->

        <button
          class="nav"
          type="button"
          data-page="tools"
          data-tool="excel"
        >

          <span class="nav-icon">↓</span>

          <span>
            Excel
          </span>

        </button>


        <!-- ДАННЫЕ -->

        <button
          class="nav"
          type="button"
          data-page="tools"
          data-tool="data"
        >

          <span class="nav-icon">◫</span>

          <span>
            Данные
          </span>

        </button>

      </div>


      <!-- =================================================
           СПРАВОЧНАЯ ИНФОРМАЦИЯ
           ================================================= -->

      <div class="nav-section">

        <div class="nav-section-title">
          СПРАВОЧНАЯ ИНФОРМАЦИЯ
        </div>


        <!-- КАРТА СОХ -->

        <button
          class="nav"
          type="button"
          data-page="tools"
          data-tool="map-soh"
        >

          <span class="nav-icon">◇</span>

          <span>
            Карта СОХ
          </span>

        </button>


        <!-- КАРТА НС -->

        <button
          class="nav"
          type="button"
          data-page="tools"
          data-tool="map-ns"
        >

          <span class="nav-icon">◇</span>

          <span>
            Карта НС
          </span>

        </button>


        <!-- СПРАВКА -->

        <button
          class="nav"
          type="button"
          data-page="tools"
          data-tool="help"
        >

          <span class="nav-icon">?</span>

          <span>
            Справка
          </span>

        </button>

      </div>

    </nav>


    <!-- ===================================================
         SIDEBAR FOOTER
         =================================================== -->

    <div class="sidebar-foot">


      <div class="offline">

        <i></i>

        <span>
          Онлайн-режим
        </span>

      </div>


      <small>

        SKLADAPLAN<br>

        Автор проекта —
        Дмитрий Бакун

      </small>

    </div>

  </aside>


  <!-- =====================================================
       MAIN
       ===================================================== -->

  <main>


    <!-- ===================================================
         TOPBAR
         =================================================== -->

    <header class="topbar">


      <!-- MOBILE MENU -->

      <button
        class="mobile-menu"
        id="mobileMenu"
        type="button"
        aria-label="Открыть меню"
        aria-expanded="false"
      >
        ☰
      </button>


      <!-- PAGE TITLE -->

      <div class="topbar-title">

        <div class="crumb">

          SKLADAPLAN /

          <span id="pageTitle">
            Главная
          </span>

        </div>


        <h1 id="heading">
          Главный экран склада
        </h1>

      </div>


      <!-- TOP ACTIONS -->

      <div
        class="top-actions"
        id="topActions"
      ></div>

    </header>


    <!-- ===================================================
         PAGE CONTENT
         =================================================== -->

    <section
      id="content"
      aria-live="polite"
    ></section>


  </main>

</div>


<!-- =====================================================
     MOBILE NAVIGATION
     ===================================================== -->

<nav
  class="mobile-nav"
  id="mobileNav"
  aria-label="Основная навигация"
>


  <!-- ГЛАВНАЯ -->

  <button
    class="mobile-nav-btn"
    type="button"
    data-page="dashboard"
  >

    <span aria-hidden="true">
      ⌂
    </span>

    <small>
      Главная
    </small>

  </button>


  <!-- БАЗА -->

  <button
    class="mobile-nav-btn"
    type="button"
    data-page="base"
  >

    <span aria-hidden="true">
      ▤
    </span>

    <small>
      База
    </small>

  </button>


  <!-- ПРИЁМКА -->

  <button
    class="mobile-nav-btn"
    type="button"
    data-page="received"
  >

    <span aria-hidden="true">
      ⇩
    </span>

    <small>
      Приёмка
    </small>

  </button>


  <!-- СБОРКА -->

  <button
    class="mobile-nav-btn"
    type="button"
    data-page="assembly"
  >

    <span aria-hidden="true">
      ◫
    </span>

    <small>
      Сборка
    </small>

    <em
      id="mobileAssemblyBadge"
      aria-hidden="true"
    ></em>

  </button>


  <!-- ЕЩЁ -->

  <button
    class="mobile-nav-btn mobile-more-btn"
    id="mobileMore"
    type="button"
    aria-label="Открыть меню"
    aria-expanded="false"
  >

    <span aria-hidden="true">
      ⋯
    </span>

    <small>
      Ещё
    </small>

  </button>

</nav>


<!-- =====================================================
     SUPABASE
     ===================================================== -->

<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<!-- =====================================================
     XLSX
     ===================================================== -->

<script
  src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"
></script>


<!-- =====================================================
     HELP
     ===================================================== -->

<script
  src="help.js"
></script>


<!-- =====================================================
     SKLADAPLAN
     ===================================================== -->

<script
  src="app.js"
></script>


</body>

</html>
